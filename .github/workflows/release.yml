# Release automation (spec 06, docs/versioning.md).
#
# The manual release checklist is error-prone: three manifests must move in
# lockstep, the vendored mosseal-core crate is a derived artifact, and
# vectors.json has a CI drift tripwire. This workflow makes the mechanical
# steps reproducible.
#
#   mode=check   (default): verify every manifest agrees on one version.
#   mode=bump:              run scripts/release.mjs --version <version>, which
#                           bumps all manifests, regenerates vectors.json, and
#                           refreshes the vendored crate. It does NOT commit —
#                           download the artifact / open a PR from the diff.
#   mode=release:           build + pack both packages and create a DRAFT GitHub
#                           Release with the tarballs attached. Publishing to
#                           GitHub Packages stays manual (review the draft, then
#                           `npm publish` in each package).

name: release

on:
    workflow_dispatch:
        inputs:
            mode:
                description: "check = verify consistency; bump = run the release script; release = draft GitHub Release"
                type: choice
                options: [check, bump, release]
                default: check
            version:
                description: "Target version for mode=bump (e.g. 0.2.0)"
                type: string
                required: false

jobs:
    release:
        name: release (${{ inputs.mode }})
        # workflow_dispatch can be triggered from any branch; restrict to prod.
        if: github.ref == 'refs/heads/prod'
        runs-on: ubuntu-latest
        # `contents: write` is required to create the draft GitHub Release.
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2
            - uses: actions/setup-node@v4
              with:
                  node-version: 24

            - name: consistency check
              run: node scripts/release.mjs --check

            - name: bump + regenerate
              if: inputs.mode == 'bump'
              run: |
                  if [ -z "${{ inputs.version }}" ]; then
                    echo "::error::version input is required when mode=bump"
                    exit 1
                  fi
                  node scripts/release.mjs --version "${{ inputs.version }}"

            - name: verify regenerated artifacts are consistent
              if: inputs.mode == 'bump'
              run: |
                  node scripts/release.mjs --check
                  cargo run -p mosseal-vectors -- --check
                  test -f "packages/mosseal/template/mosseal-core-${{ inputs.version }}.crate"

            - name: upload release diff
              if: inputs.mode == 'bump'
              uses: actions/upload-artifact@v4
              with:
                  name: release-${{ inputs.version }}
                  path: |
                      Cargo.toml
                      packages/core/package.json
                      packages/mosseal/package.json
                      packages/mosseal/template/Cargo.toml
                      packages/mosseal/template/mosseal-core-*.crate
                      crates/mosseal-vectors/vectors.json
                  retention-days: 14

            # mode=release: build + pack both packages, then create a DRAFT
            # GitHub Release with the tarballs attached. Publishing to GitHub
            # Packages stays manual — review the draft, then `npm publish`.
            - name: build + pack both packages
              if: inputs.mode == 'release'
              run: |
                  if [ -z "${{ inputs.version }}" ]; then
                    echo "::error::version input is required when mode=release"
                    exit 1
                  fi
                  (cd packages/core && npm ci && npm run build && npm pack --pack-destination /tmp)
                  (cd packages/mosseal && npm ci && npm run build && npm pack --pack-destination /tmp)

            - name: create draft GitHub Release
              if: inputs.mode == 'release'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release create "v${{ inputs.version }}" \
                    --draft \
                    --title "v${{ inputs.version }}" \
                    --notes "Draft release. Review the attached tarballs, then publish to GitHub Packages manually (\`npm publish\` in each package)." \
                    /tmp/*.tgz
