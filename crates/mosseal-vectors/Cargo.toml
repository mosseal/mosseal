[package]
name = "mosseal-vectors"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

# Conformance-vector generator (spec 08). Native-only; not shipped.
# `cargo run -p mosseal-vectors` writes `vectors.json` in this crate.
# The `drift` test regenerates in-memory and diffs against the checked-in
# file so accidental format drift fails CI.

[dependencies]
mosseal-core = { path = "../mosseal-core" }
serde_json.workspace = true
base64.workspace = true
hex.workspace = true
# Commitment-tamper forge vector (spec 08): builds a v2 envelope whose AEAD
# is valid but whose plaintext lacks the key-commitment prefix. Same version
# and feature set as mosseal-core's own dependency.
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }

[[bin]]
name = "mosseal-vectors"
path = "src/main.rs"