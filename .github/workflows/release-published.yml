# Promote a release from the `next` dist-tag to `latest` (spec 06).
#
# `release.yml` publishes new versions to the public npm registry (npmjs) under
# the `next` dist-tag so that `npm install @mosseal/cli` keeps resolving to the
# previous `latest` while the draft Release is under review. Publishing that
# draft fires this workflow, which moves `latest` to the released version.
#
# The version is taken from the release tag (`v<version>`), so the tag must match
# the version that was published under `next`.
#
# Auth is npm trusted publishing (OIDC) — no long-lived token. The trusted
# publisher for each package must be configured on npmjs.com with this workflow
# filename (`release-published.yml`) and the `npm dist-tag` action enabled.
# OIDC dist-tag management requires npm CLI >= 11.21.0, so the CLI is upgraded
# explicitly below.

name: release-published

on:
    release:
        types: [published]

jobs:
    promote:
        name: promote next → latest
        runs-on: ubuntu-latest
        # `id-token: write` is npm trusted publishing (OIDC) — no long-lived token.
        permissions:
            id-token: write
        steps:
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  # Points npm at npmjs; auth comes from OIDC, not a token.
                  registry-url: https://registry.npmjs.org
                  # Never cache in release builds.
                  package-manager-cache: false

            # OIDC dist-tag management needs npm CLI >= 11.21.0; the version
            # bundled with Node 24 may be older.
            - name: ensure npm CLI supports OIDC dist-tags
              run: npm install -g npm@^11.21.0

            - name: promote next → latest
              run: |
                  set -euo pipefail
                  VERSION="${GITHUB_REF_NAME#v}"
                  echo "promoting $VERSION to latest"

                  for name in @mosseal/core @mosseal/cli; do
                    npm dist-tag add "$name@$VERSION" latest \
                      --registry=https://registry.npmjs.org
                  done
