# Release automation (spec 06, docs/versioning.md).
#
# The root Cargo.toml `[workspace.package] version` is the single source of
# truth. The npm manifests and the template Cargo.toml must agree with it
# (enforced by the `version-lockstep` CI job); `scripts/release.mjs --sync`
# propagates a Cargo bump to them.
#
#   mode=check   (default): report the authoritative version and whether it is
#                           newer than the latest `v*` git tag. No side effects.
#   mode=release:           build + pack both npm packages, publish them to GitHub
#                           Packages under the `next` dist-tag, cross-compile the
#                           native `mosseal` CLI for every supported platform, and
#                           create a DRAFT GitHub Release with the npm tarballs,
#                           one archive per target, and a SHA256SUMS file attached.
#                           Automatically SKIPPED when the authoritative version is
#                           not newer than the latest `v*` git tag.
#
# Publishing uses the `next` dist-tag so `npm install @mosseal/cli` keeps resolving
# to the previous `latest` until the draft Release is published — see
# `release-published.yml`, which promotes `next` → `latest`.
#
# Job graph:
#   version ──┬─> npm ──────┐
#             └─> binaries ─┴─> draft-release
# `version` resolves the authoritative version + the should_release decision once;
# `npm` publishes and uploads the tarballs; `binaries` cross-compiles + uploads one
# archive per target; `draft-release` merges every artifact, writes SHA256SUMS, and
# creates the draft Release. Publishing the draft promotes `next` → `latest`.

name: release

on:
    workflow_dispatch:
        inputs:
            mode:
                description: "check = report the version decision; release = build + draft a GitHub Release (auto-skipped if not newer)"
                type: choice
                options: [check, release]
                default: check

jobs:
    # Resolve the authoritative version and decide whether this run should cut a
    # release. Split into its own job so the npm publish job and the native
    # binary matrix gate on the same decision (and so a `check` run does no work).
    version:
        name: resolve version
        # workflow_dispatch can be triggered from any branch; restrict to prod.
        if: github.ref == 'refs/heads/prod'
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.version }}
            should_release: ${{ steps.version.outputs.should_release }}
        steps:
            # Full history so `git tag` sees every release tag.
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  # Never cache in release builds.
                  package-manager-cache: false

            - name: consistency check
              run: node scripts/release.mjs --check

            # Resolve the authoritative version and compare it to the latest
            # `v*` git tag. `should_release` gates the build/pack/draft jobs.
            - name: resolve version
              id: version
              run: |
                  set -euo pipefail
                  VERSION=$(node scripts/release.mjs --print)
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"

                  # Latest released tag (version-sorted); none yet → 0.0.0.
                  LAST=$(git tag --list 'v*' --sort=-v:refname | head -n1 | sed 's/^v//')
                  LAST=${LAST:-0.0.0}
                  echo "last=$LAST" >> "$GITHUB_OUTPUT"

                  HIGHER=$(printf '%s\n%s\n' "$LAST" "$VERSION" | sort -V | tail -n1)
                  if [ "$HIGHER" = "$VERSION" ] && [ "$VERSION" != "$LAST" ]; then
                    echo "should_release=true" >> "$GITHUB_OUTPUT"
                    echo "::notice::will release $VERSION (latest tag: v$LAST)"
                  else
                    echo "should_release=false" >> "$GITHUB_OUTPUT"
                    echo "::notice::skipping — $VERSION is not newer than latest tag v$LAST"
                  fi

    # npm packages: build + pack both, publish them to GitHub Packages under the
    # `next` dist-tag, and upload the tarballs so the draft Release can attach
    # them. Publish runs BEFORE the draft Release (which creates the tag) so a
    # failed publish leaves no tag and can be retried.
    npm:
        name: npm packages
        needs: version
        if: inputs.mode == 'release' && needs.version.outputs.should_release == 'true'
        runs-on: ubuntu-latest
        # `packages: write` publishes to GitHub Packages.
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
            # The wasm32 target + wasm-pack are needed by `npm pack`'s `prepack`
            # step, which rebuilds the vendored admin wasm
            # (scripts/sync-admin-wasm.mjs) and the vendored mosseal-core crate.
            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: wasm32-unknown-unknown
            - uses: taiki-e/install-action@v2
              with:
                  # Pinned for reproducible release builds (see ci.yml).
                  tool: wasm-pack@0.15.0
            - uses: Swatinem/rust-cache@v2
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  # Never cache in release builds.
                  package-manager-cache: false

            - name: build + pack both packages
              run: |
                  (cd packages/core && npm ci && npm run build && npm pack --pack-destination /tmp)
                  (cd packages/mosseal && npm ci && npm run build && npm pack --pack-destination /tmp)

            - name: publish to GitHub Packages (next)
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail
                  VERSION="${{ needs.version.outputs.version }}"
                  # Auth via a temp npmrc so the repo's npm config is untouched.
                  NPMRC="$(mktemp)"
                  printf '//npm.pkg.github.com/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > "$NPMRC"
                  export NPM_CONFIG_USERCONFIG="$NPMRC"

                  # Idempotent: skip a package whose version is already published,
                  # so a re-run after a partial failure is safe.
                  publish() {
                    local name="$1" file="$2"
                    if npm view "$name@$VERSION" version \
                         --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
                      echo "::notice::$name@$VERSION already published; skipping"
                    else
                      # `next` keeps `latest` on the previous release until the
                      # draft Release is published (release-published.yml promotes).
                      npm publish "$file" --tag=next --registry=https://npm.pkg.github.com
                    fi
                  }
                  publish @mosseal/core "/tmp/mosseal-core-$VERSION.tgz"
                  publish @mosseal/cli  "/tmp/mosseal-cli-$VERSION.tgz"
                  rm -f "$NPMRC"

            - name: upload npm tarballs
              uses: actions/upload-artifact@v7
              with:
                  name: npm-tarballs
                  path: /tmp/*.tgz
                  if-no-files-found: error
                  retention-days: 7

    # Native CLI binaries: cross-compile the `mosseal` binary for every supported
    # platform and package one archive per target. `houseabsolute/actions-rust-cross`
    # uses `cross` (Docker) for the Linux targets and the native toolchain on the
    # macOS/Windows runners. Only `-p mosseal-cli` is built — the wasm crates are
    # wasm32-only and must not be pulled into a native build.
    binaries:
        name: binaries (${{ matrix.target }})
        needs: version
        if: inputs.mode == 'release' && needs.version.outputs.should_release == 'true'
        runs-on: ${{ matrix.runner }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - target: x86_64-unknown-linux-gnu
                      runner: ubuntu-latest
                      archive: tar.gz
                    - target: x86_64-unknown-linux-musl
                      runner: ubuntu-latest
                      archive: tar.gz
                    - target: aarch64-unknown-linux-gnu
                      runner: ubuntu-latest
                      archive: tar.gz
                    - target: aarch64-unknown-linux-musl
                      runner: ubuntu-latest
                      archive: tar.gz
                    - target: x86_64-apple-darwin
                      runner: macos-latest
                      archive: tar.gz
                    - target: aarch64-apple-darwin
                      runner: macos-latest
                      archive: tar.gz
                    - target: x86_64-pc-windows-msvc
                      runner: windows-latest
                      archive: zip
        steps:
            - uses: actions/checkout@v6

            - name: build
              uses: houseabsolute/actions-rust-cross@v1
              with:
                  command: build
                  target: ${{ matrix.target }}
                  # `--locked` keeps the release build on the committed lockfile;
                  # `--target-dir target/cross` keeps the path predictable below.
                  # `strip: false` — the release profile already sets `strip = true`.
                  args: --locked --release -p mosseal-cli --target-dir target/cross
                  strip: false

            - name: package (tar.gz)
              if: matrix.archive == 'tar.gz'
              shell: bash
              env:
                  TARGET: ${{ matrix.target }}
                  VERSION: ${{ needs.version.outputs.version }}
              run: |
                  set -euo pipefail
                  archive="mosseal-v${VERSION}-${TARGET}.tar.gz"
                  binary="target/cross/${TARGET}/release/mosseal"
                  test -f "$binary"
                  tar -czf "$archive" -C "$(dirname "$binary")" mosseal

            - name: package (zip)
              if: matrix.archive == 'zip'
              shell: pwsh
              env:
                  TARGET: ${{ matrix.target }}
                  VERSION: ${{ needs.version.outputs.version }}
              run: |
                  $ErrorActionPreference = 'Stop'
                  $archive = "mosseal-v$env:VERSION-$env:TARGET.zip"
                  $binary = "target/cross/$env:TARGET/release/mosseal.exe"
                  if (-not (Test-Path $binary)) { throw "Binary not found: $binary" }
                  Compress-Archive -Path $binary -DestinationPath $archive

            - name: upload archive
              uses: actions/upload-artifact@v7
              with:
                  name: mosseal-${{ matrix.target }}
                  path: mosseal-v${{ needs.version.outputs.version }}-${{ matrix.target }}.${{ matrix.archive }}
                  if-no-files-found: error
                  retention-days: 7

    # Draft Release: merge the npm tarballs + every native archive, write a
    # SHA256SUMS file, and create the draft. Publishing the draft fires
    # release-published.yml, which promotes `next` → `latest`.
    draft-release:
        name: draft release
        needs: [version, npm, binaries]
        if: inputs.mode == 'release' && needs.version.outputs.should_release == 'true'
        runs-on: ubuntu-latest
        # `contents: write` creates the draft Release.
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v6

            - name: download all artifacts
              uses: actions/download-artifact@v7
              with:
                  path: dist
                  merge-multiple: true

            - name: generate checksums
              working-directory: dist
              run: |
                  set -euo pipefail
                  # `extglob` so a pre-existing SHA256SUMS (re-run) is excluded
                  # from its own manifest.
                  shopt -s extglob
                  sha256sum !(SHA256SUMS) > SHA256SUMS
                  cat SHA256SUMS

            # Release notes come from CHANGELOG.md (the `[<version>]` section),
            # so the draft body is the same prose maintainers already review.
            # `parse-changelog` understands Keep a Changelog headings, including
            # the `## [0.2.1] - 2026-09-29` link-text form used here. A version
            # without a CHANGELOG entry is fine: the draft simply omits the
            # version notes (the staging note below is still appended).
            - name: install parse-changelog
              uses: taiki-e/install-action@v2
              with:
                  tool: parse-changelog@0.6.17

            - name: build release notes from CHANGELOG.md
              env:
                  VERSION: ${{ needs.version.outputs.version }}
              run: |
                  set -euo pipefail
                  # Optional: a version with no CHANGELOG entry yields an empty
                  # notes file instead of failing the release (parse-changelog
                  # exits non-zero when the version is absent; its stderr is
                  # still printed so a malformed CHANGELOG is not silently lost).
                  if ! parse-changelog CHANGELOG.md "$VERSION" > /tmp/notes.md 2>/tmp/parse-changelog.err; then
                    echo "::notice::no CHANGELOG entry for $VERSION — draft omits version notes"
                    cat /tmp/parse-changelog.err >&2 || true
                    : > /tmp/notes.md
                  fi
                  # Append the maintainer-facing staging note (dist-tag + artifacts).
                  {
                    echo
                    echo "---"
                    echo
                    echo "Published to GitHub Packages under the \`next\` dist-tag as \`@mosseal/core@$VERSION\` and \`@mosseal/cli@$VERSION\`. Native \`mosseal\` CLI binaries are attached for every supported platform (see \`SHA256SUMS\`). Review the attached artifacts, then publish this draft — that promotes \`next\` to \`latest\`."
                  } >> /tmp/notes.md
                  echo "----- release notes -----"
                  cat /tmp/notes.md

            - name: create draft GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release create "v${{ needs.version.outputs.version }}" dist/* \
                    --draft \
                    --title "v${{ needs.version.outputs.version }}" \
                    --notes-file /tmp/notes.md
